version: '3.8'

services:
  # 1. Reverse Proxy (Nginx with SSL & WSS WebSockets)
  nginx:
    image: nginx:alpine
    container_name: whatsomni-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - api
      - reverb
      - baileys
    networks:
      - whatsomni-network

  # 2. Frontend Web App (Next.js 16 / React 19)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: whatsomni-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://whatsomni.yourdomain.com/api
      - NEXT_PUBLIC_REVERB_HOST=whatsomni.yourdomain.com
      - NEXT_PUBLIC_REVERB_PORT=443
    networks:
      - whatsomni-network

  # 3. Backend REST API (Laravel 12 / PHP 8.2+)
  api:
    build:
      context: ./backend-laravel
      dockerfile: ../Dockerfile.backend
    container_name: whatsomni-api
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./backend-laravel/storage:/var/www/html/storage
    depends_on:
      - mysql
      - redis
    networks:
      - whatsomni-network

  # 4. Asynchronous Queue Worker (Laravel Horizon)
  worker:
    build:
      context: ./backend-laravel
      dockerfile: ../Dockerfile.backend
    container_name: whatsomni-worker
    restart: unless-stopped
    command: ["php", "artisan", "horizon"]
    env_file:
      - .env
    depends_on:
      - api
      - redis
    networks:
      - whatsomni-network

  # 5. Real-Time WebSockets Server (Laravel Reverb on Port 8080)
  reverb:
    build:
      context: ./backend-laravel
      dockerfile: ../Dockerfile.backend
    container_name: whatsomni-reverb
    restart: unless-stopped
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    env_file:
      - .env
    depends_on:
      - api
      - redis
    networks:
      - whatsomni-network

  # 6. WhatsApp Baileys Microservice (Node.js 20 Multi-Device Worker)
  baileys:
    build:
      context: ./services/baileys-worker
      dockerfile: ../../Dockerfile.baileys
    container_name: whatsomni-baileys
    restart: unless-stopped
    environment:
      - PORT=5001
      - BAILEYS_SECRET=${BAILEYS_SECRET:-wh_baileys_secret_key_prod_2026}
    volumes:
      - baileys-sessions:/app/sessions
    networks:
      - whatsomni-network

  # 7. Database Engine (MySQL 8.0)
  mysql:
    image: mysql:8.0
    container_name: whatsomni-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-whatsomni_production}
      MYSQL_USER: ${DB_USERNAME:-whatsomni}
      MYSQL_PASSWORD: ${DB_PASSWORD:-SecretPassword2026!}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-RootSecret2026!}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - whatsomni-network

  # 8. Cache & Queue Engine (Redis 7.2)
  redis:
    image: redis:7.2-alpine
    container_name: whatsomni-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-RedisSecret2026!}"]
    volumes:
      - redis-data:/data
    networks:
      - whatsomni-network

volumes:
  mysql-data:
  redis-data:
  baileys-sessions:

networks:
  whatsomni-network:
    driver: bridge
